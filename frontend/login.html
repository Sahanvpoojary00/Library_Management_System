<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Access - ScholarSync Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <a href="index.html" style="text-decoration: none; color: inherit; display: inline-block;">
          <i class="fa-solid fa-graduation-cap"></i>
          <h2>ScholarSync Portal</h2>
        </a>
        <p style="color: var(--text-muted); margin-top: 8px;">Enter your credentials to access your dashboard</p>
      </div>

      <!-- Tabs Toggle -->
      <div class="auth-tabs">
        <div class="auth-tab active" data-form="login-container">Portal Login</div>
        <div class="auth-tab" data-form="register-container">Student Signup</div>
      </div>

      <!-- Login Form Container -->
      <div id="login-container" class="auth-form-container active">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@college.com" required>
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span>Login to System</span>
            <i class="fas fa-sign-in-alt"></i>
          </button>
        </form>
        <div style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-muted);">
          <span>Default Admin: <strong>admin@library.com</strong> (admin123)</span><br>
          <span>Default Student: <strong>student@library.com</strong> (student123)</span>
        </div>
      </div>

      <!-- Register Form Container -->
      <div id="register-container" class="auth-form-container">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="student@college.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span>Create Student Account</span>
            <i class="fas fa-user-plus"></i>
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
